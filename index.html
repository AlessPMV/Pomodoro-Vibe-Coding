<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Temporizador Pomodoro con varios métodos (25/5, 52/17, 90/20, 50/10), alertas sonoras, contador de pomodoros y fondo animado.">
  <meta name="theme-color" content="#d94f3d">
  <title>Pomodoro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="work">

  <header class="app-header">
    <p class="brand"><span class="brand-icon" aria-hidden="true">🍅</span> Pomodoro</p>
  </header>

  <main class="app-main">
    <h1 class="visually-hidden">Temporizador Pomodoro</h1>

    <section class="card" aria-label="Temporizador Pomodoro">
      <div class="method-field">
        <label class="method-label" for="method-select">Método</label>
        <select id="method-select" class="method-select">
          <option value="classic" selected>Clásico · 25 / 5 / 15</option>
          <option value="rule5217">Regla 52/17</option>
          <option value="deep">Trabajo profundo · 90 / 20 / 30</option>
          <option value="extended">Extendido · 50 / 10 / 20</option>
        </select>
      </div>

      <div class="mode-switch" role="group" aria-label="Seleccionar fase del temporizador">
        <button type="button" class="mode-btn" id="mode-work" data-mode-key="work" aria-pressed="true">Trabajo · 25</button>
        <button type="button" class="mode-btn" id="mode-short" data-mode-key="short" aria-pressed="false">Corto · 5</button>
        <button type="button" class="mode-btn" id="mode-long" data-mode-key="long" aria-pressed="false">Largo · 15</button>
      </div>

      <div class="timer">
        <svg class="ring" viewBox="0 0 280 280" aria-hidden="true" focusable="false">
          <circle class="ring-track" cx="140" cy="140" r="130"></circle>
          <circle class="ring-progress" id="ring-progress" cx="140" cy="140" r="130"></circle>
        </svg>
        <p class="time" id="time" role="timer">25:00</p>
      </div>

      <div class="controls" aria-label="Controles del temporizador">
        <button type="button" class="btn btn-primary" id="btn-start">Iniciar</button>
        <button type="button" class="btn btn-secondary" id="btn-pause" disabled>Pausar</button>
        <button type="button" class="btn btn-secondary" id="btn-reset" disabled>Reiniciar</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite">Listo para comenzar.</p>

      <p class="cycle-counter">
        <span class="counter-icon" aria-hidden="true">🍅</span>
        Pomodoros completados: <strong id="cycle-count">0</strong>
      </p>
    </section>
  </main>

  <footer class="app-footer">
    <p>Elige un método, inicia el temporizador y sigue tu ritmo · Hecho con HTML, CSS y JavaScript puros</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
